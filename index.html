<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ganpati Bappa Morya</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <h1 class="heading">Ganpati Bappa Morya</h1>

        <img
            src="ganpati.svg"
            alt="Ganpati Bappa"
            class="ganpati-image"
        >

        <div class="buttons">

            <button id="aartiButton">
                આરતી
            </button>
        
            <button id="thaalButton">
                થાળ
            </button>
        
        </div>

    </main>


        <!-- Aarti Popup -->

        <div id="aartiPopup" class="popup">
        
            <div class="popup-content">
            
                <button id="closeAartiButton" class="close-button">
                    &times;
                </button>
            
                <img
                    src="aarti.svg"
                    alt="Ganpati Aarti"
                    class="aarti-image"
                >
            
            </div>
        
        </div>
    
    
        <!-- Thaal Popup -->
    
        <div id="thaalPopup" class="popup">
        
            <div class="popup-content">
            
                <button id="closeThaalButton" class="close-button">
                    &times;
                </button>
            
                <img
                    src="thaal.svg"
                    alt="Ganpati Thaal"
                    class="thaal-image"
                >
            
            </div>
        
        </div>
    
    
        <script src="script.js"></script>

</body>
</html>
