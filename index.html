<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ganpati Bappa Morya</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <h1 class="heading">ગણપતિ બાપ્પા મોરિયા</h1>

        <div class="ganpati-container">

            <img
                src="static/images/ganpati.svg"
                alt="Ganpati Bappa"
                class="ganpati-image"
            >

            <a href="#" class="urja-agency">
                <img
                    src="static/images/urja-agency.svg"
                    alt="Ganpati Bappa Morya"
                >
            </a>
        
        </div>
        <div class="buttons">

            <div class="buttons">

                <button id="aartiButton" class="image-button">
                    <img
                        src="static/images/aarti-btn.svg"
                        alt="આરતી"
                    >
                </button>
            
                <button id="thaalButton" class="image-button">
                    <img
                        src="static/images/thaal-btn.svg"
                        alt="થાળ"
                    >
                </button>
            
            </div>
        
        </div>

    </main>


        <!-- Aarti Popup -->

        <div id="aartiPopup" class="popup">
        
            <div class="popup-content">
            
                <button id="closeAartiButton" class="close-button">
                    &times;
                </button>
            
                <img
                    src="static/images/aarti.svg"
                    alt="Ganpati Aarti"
                    class="aarti-image"
                >
            
            </div>
        
        </div>
    
    
        <!-- Thaal Popup -->
    
        <div id="thaalPopup" class="popup">
        
            <div class="popup-content">
            
                <button id="closeThaalButton" class="close-button">
                    &times;
                </button>
            
                <img
                    src="static/images/thaal.svg"
                    alt="Ganpati Thaal"
                    class="thaal-image"
                >
            
            </div>
        
        </div>
    
        <footer>
            Priyal Patel &copy; 2026
        </footer>


        <script src="script.js"></script>

</body>
</html>
